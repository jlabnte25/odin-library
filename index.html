<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Odin Library</title>
    <link href="style.css" rel="stylesheet" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo+Black&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="header">
      <button id="open-form">
        <img src="./assets/plus.png" />
        <p>ADD A BOOK</p>
      </button>
    </div>

    <div class="container">
      <div class="bookContainer"></div>
    </div>

    <dialog class="modal" id="dialog">
      <button id="close-form">
        <img src="./assets/exit.png" width="16px" formmethod="dialog" />
      </button>
      <form id="book-form">
        <input
          type="text"
          id="book-title"
          name="book-title"
          placeholder="Title"
        />
        <input
          type="text"
          id="book-author"
          name="book-author"
          placeholder="Author"
        />
        <input
          type="number"
          id="book-total-page"
          name="book-total-page"
          placeholder="Book's Total Pages"
        />
        <button type="submit" id="submit-form">Add book</button>
      </form>
    </dialog>
  </body>

  <script src="script_refactored.js"></script>
</html>
